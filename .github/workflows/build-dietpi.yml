name: Build DietPi Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dietpi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aarch64:
    name: Build for Raspberry Pi (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: Build release binary
        run: cross build --release --target aarch64-unknown-linux-gnu

      - name: Prepare release assets
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          sha256sum baziflow-agent > baziflow-agent.sha256

      - name: Publish Permanent Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Auto-Build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          files: |
            target/aarch64-unknown-linux-gnu/release/baziflow-agent
            target/aarch64-unknown-linux-gnu/release/baziflow-agent.sha256
            .env.example
            BaziFlowAgent.service
          generate_release_notes: true
