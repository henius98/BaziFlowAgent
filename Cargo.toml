[package]
name = "baziflow-agent"
version = "0.1.0"
edition = "2024"
description = "BaziFlowAgent - A high-performance AI Agent for Bazi analysis and traditional Chinese almanac."

[dependencies]
# Telegram Bot Framework
teloxide = { version = "0.17.0", features = [
  "macros",
  "ctrlc_handler",
  "throttle",
  "webhooks-axum",
] }

# Async Runtime
tokio = { version = "1.53.2", features = ["full"] }

tokio-util = { version = "0.7.20", features = ["rt"] }

# HTTP Client
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
openssl = { version = "0.10.81", features = ["vendored"] }

# OpenAI API Client
async-openai = { version = "0.42.2", features = ["chat-completion"] }

# Error Handling
anyhow = "1.0.104"
thiserror = "2.0.21"

sqlx = { version = "0.9.0", features = [
  "sqlite",
  "runtime-tokio",
  "tls-rustls",
  "chrono",
  "macros",
  "migrate",
] }

# Async Stream utilities (for LLM streaming)
futures = "0.3.34"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

# Environment Variables
dotenvy = "0.15.7"

# Date/Time
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "registry",
] }
tracing-appender = "0.2.5"

# Scheduled Jobs
tokio-cron-scheduler = "0.15.1"

# Concurrent HashMap
dashmap = "6.2.1"

# UUID for callback data
uuid = { version = "1.28.0", features = ["v7"] }

# Web Server (for Instant View / Web view)
axum = { version = "0.8.9", features = ["macros", "ws"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }

# S3 Client for Cloudflare R2
rust-s3 = { version = "0.38.0", default-features = false, features = [
  "tokio-rustls-tls",
] }

# API Key Generation & Hashing
sha2 = "0.11.0"
hex = "0.4.3"
rand = "0.10.3"

# Async Stream utilities (for SSE streaming)
async-stream = "0.3.6"
tower = { version = "0.5.3", features = ["util"] }
aes-gcm = "0.11.1"

[profile.release]
debug = true      # Preserves full debug symbols while maintaining opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[dev-dependencies]
mockito = "1.7.2"
tokio-tungstenite = "0.30.0"

[patch.crates-io]
# Fix the private proc_macro re-export until this transitive dependency is replaced upstream.
# https://github.com/GnomedDev/proc-macro-error-2/pull/14
proc-macro-error2 = { git = "https://github.com/GnomedDev/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }
# Database
