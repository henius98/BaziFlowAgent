[package]
name = "baziflow-agent"
version = "0.1.0"
edition = "2024"
description = "BaziFlowAgent - A high-performance AI Agent for Bazi analysis and traditional Chinese almanac."

[dependencies]
# Telegram Bot Framework
teloxide = { version = "0.17", features = ["macros", "ctrlc_handler", "throttle"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

tokio-util = { version = "0.7", features = ["rt"] }

# HTTP Client
reqwest = { version = "0.13", features = ["json", "rustls"] }
openssl = { version = "0.10", features = ["vendored"] }

# OpenAI API Client
async-openai = { version = "0.40", features = ["chat-completion"] }

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Database
sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio-rustls",
    "chrono",
    "macros",
    "migrate",
] }

# Async Stream utilities (for LLM streaming)
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment Variables
dotenvy = "0.15"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"

# Scheduled Jobs
tokio-cron-scheduler = "0.15"

# Concurrent HashMap
dashmap = "6"

# UUID for callback data
uuid = { version = "1", features = ["v7"] }

# Web Server (for Instant View / Web view)
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# S3 Client for Cloudflare R2
rust-s3 = { version = "0.34", default-features = false, features = [
    "tokio-rustls-tls",
] }

# API Key Generation & Hashing
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

# Async Stream utilities (for SSE streaming)
async-stream = "0.3"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[dev-dependencies]
mockito = "1.0"
tokio-tungstenite = "0.29.0"

[patch.crates-io]
# Fix the private proc_macro re-export until this transitive dependency is replaced upstream.
# https://github.com/GnomedDev/proc-macro-error-2/pull/14
proc-macro-error2 = { git = "https://github.com/GnomedDev/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }
